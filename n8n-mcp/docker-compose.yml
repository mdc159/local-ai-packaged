services:
  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    container_name: n8n-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - MCP_MODE=http
      - PORT=3000
      - AUTH_TOKEN=${AUTH_TOKEN}
      - N8N_API_URL=${N8N_API_URL:-http://host.docker.internal:5678}
      - N8N_API_KEY=${N8N_API_KEY}
      - WEBHOOK_SECURITY_MODE=${WEBHOOK_SECURITY_MODE:-moderate}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - localai_default

networks:
  localai_default:
    external: true
    name: localai_default
